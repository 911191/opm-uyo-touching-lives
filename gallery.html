<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gallery | OPM UYO TOUCHING LIVES</title><style>
:root{--n:#071d52;--r:#e31b23;--g:#f4c928;--m:#667085;--line:#e4e7ec}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#17213b;background:#f5f7fb}a{text-decoration:none}.top{background:var(--n);color:#fff;padding:10px 5%;font-size:14px}.head{background:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.brand{font-size:24px;font-weight:900;color:var(--n)}.brand span{color:var(--r)}.back{background:var(--n);color:#fff;padding:11px 18px;border-radius:8px;font-weight:800}.wrap{max-width:1200px;margin:auto;padding:60px 5%}.title{text-align:center;color:var(--n);font-size:40px;margin:0 0 10px}.intro{text-align:center;color:var(--m);max-width:760px;margin:0 auto 35px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 8px 25px #071d5214}.card img{width:100%;height:240px;display:block;object-fit:cover}.caption{padding:13px;color:var(--n);font-weight:900}.empty{text-align:center;color:var(--m);grid-column:1/-1}footer{background:#041432;color:#cbd7eb;padding:35px 5%;text-align:center;margin-top:40px}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.title{font-size:30px}}@media(max-width:400px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="top">OPM UYO TOUCHING LIVES • Gallery</div><header class="head"><a class="brand" href="index.html">OPM UYO <span>TOUCHING LIVES</span></a><a class="back" href="index.html">← Home</a></header><main class="wrap"><h1 class="title">Training & Community Gallery</h1><p class="intro">Photos selected and published by the administrator from practical training, outreach and empowerment activities.</p><div id="grid" class="grid"><div class="empty">Loading gallery…</div></div></main><footer>© <span id="year"></span> OPM UYO TOUCHING LIVES. All rights reserved.</footer><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
(async()=>{const g=document.getElementById('grid');try{const r=await fetch('/api/public/data?resource=gallery',{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||('HTTP '+r.status));const a=d.items||[];g.innerHTML=a.length?a.map(x=>`<article class="card"><img src="${esc(x.image_url)}" alt="${esc(x.title||'OPM UYO TOUCHING LIVES photo')}" loading="lazy"><div class="caption">${esc(x.title||'Training Photo')}${x.description?`<div style="font-weight:400;color:var(--m);margin-top:4px">${esc(x.description)}</div>`:''}</div></article>`).join(''):'<div class="empty">No active gallery photos have been published yet.</div>'}catch(e){console.error(e);g.innerHTML='<div class="empty">Gallery could not be loaded right now.</div>'}})();document.getElementById('year').textContent=new Date().getFullYear();
</script></body></html>
