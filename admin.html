<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OPM UYO TOUCHING LIVES — Admin</title><style>
:root{--n:#071d52;--b:#0d3fa8;--r:#e31b23;--bg:#f4f7fb;--bd:#dfe5ef}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:var(--bg);color:#17213b}button,input,textarea,select{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,var(--n),var(--b))}.box,.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:20px}.box{width:min(430px,100%)}label{display:block;font-weight:bold;margin:12px 0 6px}input,textarea,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:bold;cursor:pointer}.primary{background:var(--r);color:#fff}.secondary{background:#e9eef8;color:var(--n)}.danger{background:#fee4e2;color:#a21b12}.app{display:none}.side{position:fixed;inset:0 auto 0 0;width:235px;background:var(--n);color:white;padding:18px}.side button{display:block;width:100%;text-align:left;border:0;background:transparent;color:white;padding:11px;border-radius:8px;margin:3px 0}.side button.active,.side button:hover{background:#ffffff1c}.logout{position:absolute;bottom:15px;left:15px;width:calc(100% - 30px)!important;background:var(--r)!important;text-align:center!important}.main{margin-left:235px;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.pages>section{display:none}.pages>section.active{display:block}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.num{font-size:30px;font-weight:900;color:var(--n)}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}.wrap{overflow:auto}.msg{padding:10px;border-radius:8px;margin:8px 0}.ok{background:#e6f7ed;color:#126b37}.err{background:#fee4e2;color:#8a1c16}.modal{display:none;position:fixed;inset:0;background:#0008;place-items:center;padding:20px}.modal.open{display:grid}.modal .card{width:min(620px,100%);max-height:90vh;overflow:auto}@media(max-width:850px){.side{transform:translateX(-100%);z-index:5}.side.open{transform:none}.main{margin:0}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.stats{grid-template-columns:1fr}}
</style></head><body>
<div id="login" class="login"><div class="box"><h2>Admin Dashboard</h2><p>OPM UYO TOUCHING LIVES</p><label>Username</label><input id="u" autocomplete="username"><label>Password</label><input id="p" type="password" autocomplete="current-password"><button class="btn primary" style="width:100%;margin-top:14px" onclick="login()">Sign in</button><div id="lm"></div></div></div>
<div id="app" class="app"><aside id="side" class="side"><h3>OPM UYO<br>TOUCHING LIVES</h3><div id="nav"></div><button class="logout btn" onclick="logout()">Sign out</button></aside><main class="main"><div class="top"><div><button class="btn secondary" onclick="side.classList.toggle('open')">☰</button> <strong id="title">Admin Dashboard</strong></div><span>● Database connected</span></div><div id="gm"></div><div class="pages">
<section id="dashboard" class="active"><div class="stats"><div class="card">Training Skills<div class="num" id="c1">—</div></div><div class="card">Applications<div class="num" id="c2">—</div></div><div class="card">News & Events<div class="num" id="c3">—</div></div><div class="card">Gallery Photos<div class="num" id="c4">—</div></div></div></section>
<section id="training"><div class="card"><div class="top"><h3>Training Skills</h3><button class="btn primary" onclick="openEdit('training-skills')">+ Add Skill</button></div><div id="t-training-skills"></div></div></section>
<section id="applications"><div class="card"><h3>Training Applications</h3><div id="t-applications"></div></div></section>
<section id="news"><div class="card"><div class="top"><h3>News & Events</h3><button class="btn primary" onclick="openEdit('news-events')">+ New Update</button></div><div id="t-news-events"></div></div></section>
<section id="gallery"><div class="card"><div class="top"><h3>Training Gallery</h3><button class="btn primary" onclick="openEdit('gallery')">+ Add Photo</button></div><div id="t-gallery"></div></div></section>
<section id="homepage"><div class="card"><div class="top"><h3>Homepage Specials</h3><button class="btn primary" onclick="openEdit('homepage')">+ Add Special</button></div><div id="t-homepage"></div></div></section>
<section id="partnerships"><div class="card"><h3>Partnership Applications</h3><div id="t-partnerships"></div></div></section>
</div></main></div>
<div id="modal" class="modal"><div class="card"><h3 id="mt"></h3><div id="mf"></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:15px"><button class="btn secondary" onclick="modal.classList.remove('open')">Cancel</button><button class="btn primary" onclick="save()">Save</button></div></div></div>
<script>
const API='/api/admin/data';let data={},editing=null;
const cfg={
 'training-skills':[['name','Name','text',1],['description','Description','textarea'],['active','Active','checkbox'],['sort_order','Sort order','number']],
 'news-events':[['item_type','Type: news or event','text',1],['title','Title','text',1],['summary','Summary','textarea'],['content','Content','textarea'],['image_url','Image URL','url'],['event_date','Event date','date'],['published','Published','checkbox']],
 gallery:[['title','Title','text'],['description','Description','textarea'],['image_url','Image URL','url',1],['active','Active','checkbox'],['sort_order','Sort order','number']],
 homepage:[['title','Title','text'],['description','Description','textarea'],['image_url','Image URL','url'],['active','Active','checkbox'],['sort_order','Sort order','number']]
};
const labels={'dashboard':'Dashboard','training':'Training Skills','applications':'Applications','news':'News & Events','gallery':'Gallery','homepage':'Homepage','partnerships':'Partnerships'};
function nav(){nav.innerHTML=Object.entries(labels).map(([k,v])=>`<button onclick="go('${k}',this)" class="${k==='dashboard'?'active':''}">${v}</button>`).join('')}
function go(id,b){document.querySelectorAll('.pages>section').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');title.textContent=labels[id];side.classList.remove('open')}
async function req(url,opt={}){let r=await fetch(url,{credentials:'include',headers:{'Content-Type':'application/json'},...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);return d}
async function login(){lm.textContent='';try{await req('/api/admin/login',{method:'POST',body:JSON.stringify({username:u.value,password:p.value})});app.style.display='block';document.getElementById('login').style.display='none';nav();await loadAll()}catch(e){lm.className='msg err';lm.textContent=e.message}}
async function logout(){try{await req('/api/admin/logout',{method:'POST'})}finally{location.reload()}}
async function load(r){let d=await req(`${API}?resource=${r}`);data[r]=d.items||[];render(r)}
async function loadAll(){for(let r of ['training-skills','applications','news-events','gallery','homepage','partnerships'])try{await load(r)}catch(e){console.error(r,e)}c1.textContent=(data['training-skills']||[]).length;c2.textContent=(data.applications||[]).length;c3.textContent=(data['news-events']||[]).length;c4.textContent=(data.gallery||[]).length}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(r){let el=document.getElementById('t-'+r),a=data[r]||[];if(!el)return;if(!a.length){el.innerHTML='<p>No records yet.</p>';return}let keys=r==='applications'?['full_name','email','phone','preferred_skill','status']:r==='partnerships'?['organization_name','contact_name','email','phone','status']:r==='training-skills'?['name','description','active']:r==='news-events'?['item_type','title','event_date','published']:['title','image_url','active'];el.innerHTML='<div class="wrap"><table class="table"><thead><tr>'+keys.map(k=>`<th>${k.replaceAll('_',' ')}</th>`).join('')+'<th>Actions</th></tr></thead><tbody>'+a.map(x=>`<tr>${keys.map(k=>`<td>${esc(x[k])}</td>`).join('')}<td>${cfg[r]?`<button class="btn secondary" onclick="openEdit('${r}',${x.id})">Edit</button> `:''}<button class="btn danger" onclick="del('${r}',${x.id})">Delete</button></td></tr>`).join('')+'</tbody></table></div>'}
function openEdit(r,id){let x=id?(data[r]||[]).find(q=>q.id===id):null;editing={r,id:id||null};mt.textContent=(x?'Edit ':'Add ')+(r==='training-skills'?'Training Skill':r);mf.innerHTML=cfg[r].map(([k,l,t,req])=>t==='checkbox'?`<label><input id="f_${k}" type="checkbox" ${x?.[k]===undefined||x[k]?'checked':''}> ${l}</label>`:`<label>${l}${req?' *':''}</label><${t==='textarea'?'textarea':'input'} id="f_${k}" type="${t==='textarea'?'':t}" ${req?'required':''}></${t==='textarea'?'textarea':'input'}>`).join('');for(let [k] of cfg[r]){let e=document.getElementById('f_'+k);if(e&&e.type==='checkbox')e.checked=x?.[k]===undefined?true:!!x[k];else if(e&&x?.[k]!=null)e.value=x[k]}modal.classList.add('open')}
async function save(){let {r,id}=editing,b={};for(let [k,,t] of cfg[r]){let e=document.getElementById('f_'+k);b[k]=t==='checkbox'?e.checked:(e.value||null)}try{await req(`${API}?resource=${r}${id?'&id='+id:''}`,{method:id?'PATCH':'POST',body:JSON.stringify(b)});modal.classList.remove('open');gm.className='msg ok';gm.textContent='Saved successfully';await loadAll()}catch(e){gm.className='msg err';gm.textContent=e.message}}
async function del(r,id){if(!confirm('Delete this record?'))return;try{await req(`${API}?resource=${r}&id=${id}`,{method:'DELETE'});await loadAll()}catch(e){gm.className='msg err';gm.textContent=e.message}}
check();async function check(){try{await req('/api/admin/me');app.style.display='block';document.getElementById('login').style.display='none';nav();await loadAll()}catch{}}
</script></body></html>
