<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>News & Events | OPM UYO TOUCHING LIVES"><style>
:root{--n:#071d52;--b:#123f91;--r:#e31b23;--g:#f4c928;--m:#667085;--l:#f5f7fb;--line:#e4e7ec}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#17213b;background:#fff}a{text-decoration:none;color:inherit}.top{background:var(--n);color:#fff;padding:10px 5%;font-size:14px}.head{padding:18px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}.brand{font-size:24px;font-weight:900;color:var(--n)}.brand span{color:var(--r)}.back{background:var(--n);color:#fff;padding:11px 18px;border-radius:8px;font-weight:800}.wrap{max-width:1200px;margin:auto;padding:60px 5%}.title{text-align:center;color:var(--n);font-size:40px;margin:0 0 10px}.intro{text-align:center;color:var(--m);max-width:760px;margin:0 auto 35px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 8px 25px #071d5214}.card img,.video{width:100%;height:210px;object-fit:cover;background:var(--n)}.video{display:grid;place-items:center;color:#fff;font-weight:900}.body{padding:20px}.type{color:var(--r);font-weight:900;font-size:13px}.body h2{color:var(--n);margin:6px 0}.body p{color:var(--m)}.summary{font-size:18px;font-weight:700}.content{color:#17213b;line-height:1.8;white-space:normal}.detail{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 8px 25px #071d5214;max-width:900px;margin:0 auto}.detail img,.detail .video{width:100%;max-height:520px;height:auto;min-height:240px;object-fit:cover;background:var(--n)}.detail .body{padding:28px}.back{display:inline-block;background:var(--n);color:#fff;padding:10px 16px;border-radius:8px;font-weight:800;margin-top:14px}footer{background:#041432;color:#cbd7eb;padding:35px 5%;text-align:center;margin-top:40px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.grid{grid-template-columns:1fr}.title{font-size:30px}}
</style></head><body><div class="top">OPM UYO TOUCHING LIVES • News & Events</div><header class="head"><a class="brand" href="index.html">OPM UYO <span>TOUCHING LIVES</span></a><a class="back" href="index.html">← Home</a></header><main class="wrap"><h1 class="title">Latest News & Events</h1><p class="intro">Published updates, announcements, activities, events and video highlights from OPM UYO TOUCHING LIVES.</p><div id="grid" class="grid"><p>Loading updates…</p></div></main><footer>© <span id="year"></span> OPM UYO TOUCHING LIVES. All rights reserved.</footer><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const imageSrc=u=>{const s=String(u||'');return /https:\/\/(?:www\.)?(?:ibb\.co|imgbb\.com)\//i.test(s)?'/api/public/image?url='+encodeURIComponent(s):s};
(async()=>{const g=document.getElementById('grid');try{const r=await fetch('/api/public/data?resource=news-events',{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||('HTTP '+r.status));const a=d.items||[];const id=new URLSearchParams(location.search).get('id');const item=id?a.find(x=>String(x.id)===String(id)):null;
if(id && !item){g.innerHTML='<p>That update could not be found.</p>';return}
if(item){document.title=(item.title||'News & Event')+' | OPM UYO TOUCHING LIVES';const isVideo=String(item.item_type||'').toLowerCase()==='video'||/\.(mp4|webm|ogg)(\?|$)/i.test(String(item.image_url||''));const media=item.image_url?(isVideo?`<video class="video" controls preload="metadata"><source src="${esc(item.image_url)}"></video>`:`<img src="${esc(imageSrc(item.image_url))}" alt="${esc(item.title||'News image')}" loading="eager" onerror="this.style.display='none'">`):'';g.innerHTML=`<article class="detail">${media}<div class="body"><div class="type">${esc((item.item_type||'NEWS').toUpperCase())}${item.event_date?' • '+esc(item.event_date):''}</div><h2>${esc(item.title||'Untitled update')}</h2>${item.summary?`<p class="summary">${esc(item.summary)}</p>`:''}<div class="content">${esc(item.content||item.summary||'').replace(/\n/g,'<br>')}</div><p><a class="back" href="news.html">← Back to News & Events</a></p></div></article>`;return}
g.innerHTML=a.length?a.map(x=>{const isVideo=String(x.item_type||'').toLowerCase()==='video'||/\.(mp4|webm|ogg)(\?|$)/i.test(String(x.image_url||''));const media=x.image_url?(isVideo?`<video class="video" controls preload="metadata"><source src="${esc(x.image_url)}"></video>`:`<img src="${esc(imageSrc(x.image_url))}" alt="${esc(x.title||'News image')}" loading="lazy" onerror="this.style.display='none'">`):`<div class="video">NEWS & EVENTS</div>`;return `<article class="card">${media}<div class="body"><div class="type">${esc((x.item_type||'NEWS').toUpperCase())}${x.event_date?' • '+esc(x.event_date):''}</div><h2>${esc(x.title||'Untitled update')}</h2><p>${esc(x.summary||x.content||'')}</p><a class="back" href="news.html?id=${encodeURIComponent(x.id)}">Read full update →</a></div></article>`}).join(''):'<p>No published news or events yet.</p>'}catch(e){console.error(e);g.innerHTML='<p>News and events could not be loaded right now.</p>'}})();document.getElementById('year').textContent=new Date().getFullYear();
</script></body></html>
