<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>News & Events | OPM UYO TOUCHING LIVES</title>
<style>
:root{--navy:#071b3a;--blue:#0b4ea2;--gold:#d4a72c;--light:#f5f7fb;--text:#172033;--muted:#667085}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:var(--light);line-height:1.65}
header{background:var(--navy);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:10}
.nav{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between}
.brand,.back{color:#fff;text-decoration:none}
.brand{font-weight:800;font-size:18px}
.back{border:1px solid #ffffff66;padding:8px 13px;border-radius:8px;font-size:14px}
main{max-width:1000px;margin:35px auto;padding:0 18px 50px}
.status,article{background:#fff;border:1px solid #e5e7eb;border-radius:16px}
.status{padding:25px;text-align:center;color:var(--muted)}
article{overflow:hidden;box-shadow:0 6px 24px #071b3a14;margin-bottom:22px}
.hero-media{width:100%;max-height:520px;object-fit:cover;display:block;background:#eef2f7}
.media-wrap{position:relative;width:100%;background:#071b3a}
.video-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000}
.video-wrap iframe,.video-wrap video{position:absolute;inset:0;width:100%;height:100%;border:0}
.media-caption{padding:9px 14px;background:#071b3a;color:#fff;font-size:13px}
.content{padding:28px}
.badge{display:inline-block;background:#eaf2ff;color:var(--blue);font-weight:700;font-size:12px;text-transform:uppercase;padding:5px 9px;border-radius:999px;margin-bottom:10px}
h1{margin:0 0 10px;color:var(--navy);font-size:clamp(28px,5vw,46px);line-height:1.15}
.date{color:var(--muted);font-size:14px;margin-bottom:22px}
.summary{font-size:19px;font-weight:600;color:#344054;padding:15px 18px;background:#f8fafc;border-left:4px solid var(--gold);border-radius:8px;margin-bottom:24px}
.body-text{font-size:17px;white-space:pre-wrap;word-break:break-word}
.error{color:#b42318;background:#fef3f2}
.button{display:inline-block;margin:22px 8px 0 0;color:#fff;background:var(--blue);text-decoration:none;padding:10px 16px;border-radius:8px;font-weight:700}
.empty-media{padding:35px;text-align:center;color:#dbe7ff;background:#071b3a;font-weight:700}
footer{text-align:center;padding:25px 15px;background:var(--navy);color:#fff;font-size:13px}
@media(max-width:600px){
 main{margin:22px auto;padding:0 12px 35px}
 .content{padding:20px}
 .summary{font-size:16px}
 .body-text{font-size:16px}
}
</style>
</head>
<body>
<header>
  <div class="nav">
    <a class="brand" href="index.html">OPM UYO TOUCHING LIVES</a>
    <a class="back" href="index.html">← Home</a>
  </div>
</header>

<main>
  <div id="app" class="status">Loading news & events…</div>
</main>

<footer>OPM UYO TOUCHING LIVES · Empowering Lives, Building Skills, And Transforming Communities.</footer>

<script>
(function(){
  "use strict";

  const app = document.getElementById("app");

  function esc(v){
    return String(v == null ? "" : v).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c];
    });
  }

  function getId(){
    return new URLSearchParams(location.search).get("id");
  }

  function fmt(v){
    if(!v) return "";
    const d = new Date(v);
    return isNaN(d) ? esc(v) : d.toLocaleDateString(undefined,{
      year:"numeric",month:"long",day:"numeric"
    });
  }

  // Keep Cloudinary/direct HTTPS media direct.
  // Only legacy ImgBB page/image URLs need the site's image proxy.
  function mediaUrl(value){
    const u = String(value || "").trim();
    if(!u) return "";
    if(/^https:\/\/(?:www\.)?(?:ibb\.co|imgbb\.com)\//i.test(u)){
      return "/api/public/image?url=" + encodeURIComponent(u);
    }
    return u;
  }

  function youtubeId(value){
    const s = String(value || "");
    const m = s.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/i);
    return m ? m[1] : null;
  }

  function facebookEmbed(value){
    const s = String(value || "");
    if(!/facebook\.com|fb\.watch/i.test(s)) return null;
    return "https://www.facebook.com/plugins/video.php?href=" +
      encodeURIComponent(s) + "&show_text=false&width=560";
  }

  function isDirectVideo(value){
    return /\.(mp4|webm|ogg)(?:[?#].*)?$/i.test(String(value || ""));
  }

  function videoHtml(x){
    const direct = x.video_url || "";
    const embed = x.video_embed_url || "";

    const yt = youtubeId(embed) || youtubeId(direct);
    if(yt){
      return '<div class="video-wrap">' +
        '<iframe src="https://www.youtube-nocookie.com/embed/' +
        encodeURIComponent(yt) +
        '?rel=0&modestbranding=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="' +
        esc(x.title || "Video") + '"></iframe></div>';
    }

    const fb = facebookEmbed(embed || direct);
    if(fb){
      return '<div class="video-wrap"><iframe src="' + esc(fb) +
        '" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="' +
        esc(x.title || "Facebook video") + '"></iframe></div>';
    }

    if(direct && isDirectVideo(direct)){
      return '<div class="video-wrap"><video controls playsinline preload="metadata" src="' +
        esc(mediaUrl(direct)) + '"></video></div>';
    }

    // Cloudinary video URLs sometimes do not end in .mp4.
    // If the admin explicitly marked the record as VIDEO, let the browser
    // try the supplied direct URL as a video source.
    if(String(x.item_type || "").toLowerCase() === "video" && direct){
      return '<div class="video-wrap"><video controls playsinline preload="metadata" src="' +
        esc(mediaUrl(direct)) + '"></video></div>';
    }

    return "";
  }

  function imageHtml(x){
    const u = mediaUrl(x.image_url || "");
    if(!u) return "";
    return '<img class="hero-media" src="' + esc(u) +
      '" alt="' + esc(x.title || "News image") +
      '" loading="eager" onerror="this.style.display=\'none\'">';
  }

  function mediaHtml(x){
    const video = videoHtml(x);
    const image = imageHtml(x);

    if(video && image){
      return '<div class="media-wrap">' + video +
        '<img class="hero-media" src="' + esc(mediaUrl(x.image_url)) +
        '" alt="' + esc(x.title || "News image") + '" loading="lazy"></div>';
    }
    if(video) return video;
    if(image) return image;

    return '<div class="empty-media">NEWS & EVENTS</div>';
  }

  async function load(){
    const r = await fetch("/api/public/data?resource=news-events", {
      cache:"no-store",
      headers:{Accept:"application/json"}
    });

    const t = await r.text();
    let d;
    try { d = JSON.parse(t); }
    catch(e){ throw Error("The news service returned invalid data."); }

    if(!r.ok) throw Error(d.error || "Unable to load news.");

    const a = Array.isArray(d) ? d :
      Array.isArray(d.items) ? d.items :
      Array.isArray(d.data) ? d.data :
      Array.isArray(d.newsEvents) ? d.newsEvents : [];

    return a.filter(function(x){ return x.published !== false; });
  }

  function detail(x){
    app.className = "";
    app.innerHTML =
      '<article>' +
        mediaHtml(x) +
        '<div class="content">' +
          '<span class="badge">' + esc(x.item_type || "News") + '</span>' +
          '<h1>' + esc(x.title || "Untitled update") + '</h1>' +
          '<div class="date">' + fmt(x.event_date || x.created_at) + '</div>' +
          (x.summary ? '<div class="summary">' + esc(x.summary) + '</div>' : '') +
          '<div class="body-text">' +
            (x.content ? esc(x.content) : "No additional details were provided for this update.") +
          '</div>' +
          '<a class="button" href="news.html">← All News & Events</a>' +
          '<a class="button" href="index.html">← Homepage</a>' +
        '</div>' +
      '</article>';
  }

  function listing(a){
    if(!a.length){
      app.innerHTML = '<div class="status"><h2>No news or events available</h2><p>Please check back later.</p></div>';
      return;
    }

    app.className = "";

    app.innerHTML = a.map(function(x){
      return '<article>' +
        mediaHtml(x) +
        '<div class="content">' +
          '<span class="badge">' + esc(x.item_type || "News") + '</span>' +
          '<h1 style="font-size:28px">' + esc(x.title || "Untitled update") + '</h1>' +
          '<div class="date">' + fmt(x.event_date || x.created_at) + '</div>' +
          (x.summary ? '<div class="summary">' + esc(x.summary) + '</div>' : '') +
          '<a class="button" href="news.html?id=' + encodeURIComponent(x.id) + '">View Details →</a>' +
        '</div>' +
      '</article>';
    }).join("");
  }

  async function start(){
    try{
      const a = await load();
      const id = getId();

      if(id){
        const x = a.find(function(v){ return String(v.id) === String(id); });

        if(!x){
          app.className = "status error";
          app.innerHTML =
            '<h2>News update not found</h2>' +
            '<p>The requested update could not be found or is no longer published.</p>' +
            '<a class="button" href="news.html">← News & Events</a>';
          return;
        }

        detail(x);
      } else {
        listing(a);
      }
    }catch(e){
      console.error(e);
      app.className = "status error";
      app.innerHTML =
        '<h2>Unable to load this news update</h2>' +
        '<p>' + esc(e.message || "An unexpected error occurred.") + '</p>' +
        '<p>Please refresh the page and try again.</p>' +
        '<a class="button" href="index.html">← Homepage</a>';
    }
  }

  start();
})();
</script>
</body>
</html>
