<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>News & Events | OPM UYO TOUCHING LIVES</title><style>
:root{--navy:#071b3a;--blue:#0b4ea2;--gold:#d4a72c;--light:#f5f7fb;--text:#172033;--muted:#667085}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:var(--light);line-height:1.65}header{background:var(--navy);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:10}.nav{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between}.brand,.back{color:#fff;text-decoration:none}.brand{font-weight:800;font-size:18px}.back{border:1px solid #ffffff66;padding:8px 13px;border-radius:8px;font-size:14px}main{max-width:1000px;margin:35px auto;padding:0 18px 50px}.status,article{background:#fff;border:1px solid #e5e7eb;border-radius:16px}.status{padding:25px;text-align:center;color:var(--muted)}article{overflow:hidden;box-shadow:0 6px 24px #071b3a14}.hero-media{width:100%;max-height:520px;object-fit:cover;display:block;background:#eef2f7}.content{padding:28px}.badge{display:inline-block;background:#eaf2ff;color:var(--blue);font-weight:700;font-size:12px;text-transform:uppercase;padding:5px 9px;border-radius:999px;margin-bottom:10px}h1{margin:0 0 10px;color:var(--navy);font-size:clamp(28px,5vw,46px);line-height:1.15}.date{color:var(--muted);font-size:14px;margin-bottom:22px}.summary{font-size:19px;font-weight:600;color:#344054;padding:15px 18px;background:#f8fafc;border-left:4px solid var(--gold);border-radius:8px;margin-bottom:24px}.body-text{font-size:17px;white-space:pre-wrap;word-break:break-word}.video-wrap,.embed-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#050505}.video-wrap video,.embed-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000}.media-note{margin:14px 0 0;padding:12px 14px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;color:#667085;font-size:14px}.media-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.media-action{display:inline-block;text-decoration:none;color:#fff;background:var(--blue);padding:9px 13px;border-radius:8px;font-weight:700;font-size:14px}.media-action.secondary{background:#071b3a}.error{color:#b42318;background:#fef3f2}.button{display:inline-block;margin:22px 8px 0 0;color:#fff;background:var(--blue);text-decoration:none;padding:10px 16px;border-radius:8px;font-weight:700}footer{text-align:center;padding:25px 15px;background:var(--navy);color:#fff;font-size:13px}@media(max-width:600px){main{margin:22px auto;padding:0 12px 35px}.content{padding:20px}.summary{font-size:16px}.body-text{font-size:16px}}
</style></head><body><header><div class="nav"><a class="brand" href="index.html">OPM UYO TOUCHING LIVES</a><a class="back" href="index.html">← Home</a></div></header><main><div id="app" class="status">Loading news & events…</div></main><footer>OPM UYO TOUCHING LIVES · Empowering Lives, Building Skills, And Transforming Communities.</footer><script>
(function(){"use strict";var app=document.getElementById("app");function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;")}function getId(){return new URLSearchParams(location.search).get("id")}function fmt(v){if(!v)return"";var d=new Date(v);return isNaN(d)?esc(v):d.toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"})}function mediaInfo(value){
  var raw=String(value||"").trim();
  if(!raw)return{kind:"none",source:""};
  var lower=raw.toLowerCase();
  var m=raw.match(/(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|shorts\/|live\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/i);
  if(m)return{kind:"youtube",source:raw,embed:"https://www.youtube.com/embed/"+m[1]};
  if(/^(https?:\/\/)?(www\.)?facebook\.com\//i.test(raw)&&/(video|watch|reel|videos|share)/i.test(raw))return{kind:"facebook",source:raw,embed:"https://www.facebook.com/plugins/video.php?href="+encodeURIComponent(raw)+"&show_text=false&width=560"};
  m=raw.match(/(?:vimeo\.com\/(?:video\/)?)(\d+)/i);
  if(m)return{kind:"vimeo",source:raw,embed:"https://player.vimeo.com/video/"+m[1]};
  m=raw.match(/drive\.google\.com\/file\/d\/([^/]+)\/(?:view|edit)?/i);
  if(m)return{kind:"drive",source:raw,embed:"https://drive.google.com/file/d/"+m[1]+"/preview"};
  if(/\.(mp4|webm|ogg|ogv)(?:[?#].*)?$/i.test(lower)||/^data:video\//i.test(raw))return{kind:"video",source:raw};
  if(/(?:dailymotion\.com\/embed|streamable\.com\/e\/|rumble\.com\/embed|player\.)/i.test(raw))return{kind:"iframe",source:raw,embed:raw};
  if(/\.(jpg|jpeg|png|gif|webp|avif|svg)(?:[?#].*)?$/i.test(lower)||/^data:image\//i.test(raw))return{kind:"image",source:raw};
  return{kind:"link",source:raw};
}
function media(x){
  var u=x.image_url||"";
  var info=mediaInfo(u);
  if(info.kind==="none")return"";
  var title=esc(x.title||"News & Events media");
  var original=esc(info.source);
  if(info.kind==="youtube"||info.kind==="facebook"||info.kind==="vimeo"||info.kind==="drive"||info.kind==="iframe"){
    return '<div class="embed-wrap"><iframe src="'+esc(info.embed)+'" title="'+title+'" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>'+
      '<div class="media-actions"><a class="media-action secondary" href="'+original+'" target="_blank" rel="noopener">Open original video</a></div>';
  }
  if(info.kind==="video"){
    return '<div class="video-wrap"><video controls playsinline preload="metadata" src="'+esc(info.source)+'"></video></div>'+
      '<div class="media-actions"><a class="media-action secondary" href="'+original+'" target="_blank" rel="noopener">Open video file</a></div>';
  }
  if(info.kind==="image"){
    var src=/^data:image\//i.test(info.source)?info.source:'/api/public/image?url='+encodeURIComponent(info.source);
    return '<img class="hero-media" src="'+esc(src)+'" alt="'+title+'">';
  }
  return '<div class="media-note">This media link could not be converted into an embedded player. You can still open the original link.</div><div class="media-actions"><a class="media-action" href="'+original+'" target="_blank" rel="noopener">Open media</a></div>';
}async function load(){var r=await fetch("/api/public/data?resource=news-events",{cache:"no-store",headers:{Accept:"application/json"}}),t=await r.text(),d;try{d=JSON.parse(t)}catch(e){throw Error("The news service returned invalid data.")}if(!r.ok)throw Error(d.error||"Unable to load news.");var a=Array.isArray(d)?d:Array.isArray(d.items)?d.items:Array.isArray(d.data)?d.data:Array.isArray(d.newsEvents)?d.newsEvents:[];return a.filter(function(x){return x.published!==false})}function detail(x){app.className="";app.innerHTML='<article>'+media(x)+'<div class="content"><span class="badge">'+esc(x.item_type||"News")+'</span><h1>'+esc(x.title||"Untitled update")+'</h1><div class="date">'+fmt(x.event_date||x.created_at)+'</div>'+(x.summary?'<div class="summary">'+esc(x.summary)+'</div>':'')+'<div class="body-text">'+(x.content?esc(x.content):"No additional details were provided for this update.")+'</div><a class="button" href="news.html">← All News & Events</a><a class="button" href="index.html">← Homepage</a></div></article>'}function listing(a){if(!a.length){app.innerHTML='<div class="status"><h2>No news or events available</h2><p>Please check back later.</p></div>';return}app.className="";app.innerHTML=a.map(function(x){return'<article style="margin-bottom:22px">'+media(x)+'<div class="content"><span class="badge">'+esc(x.item_type||"News")+'</span><h1 style="font-size:28px">'+esc(x.title||"Untitled update")+'</h1><div class="date">'+fmt(x.event_date||x.created_at)+'</div>'+(x.summary?'<div class="summary">'+esc(x.summary)+'</div>':'')+'<a class="button" href="news.html?id='+encodeURIComponent(x.id)+'">Read full update →</a></div></article>'}).join("")}async function start(){try{var a=await load(),id=getId();if(id){var x=a.find(function(v){return String(v.id)===String(id)});if(!x){app.className="status error";app.innerHTML='<h2>News update not found</h2><p>The requested update could not be found or is no longer published.</p><a class="button" href="news.html">← News & Events</a>';return}detail(x)}else listing(a)}catch(e){console.error(e);app.className="status error";app.innerHTML='<h2>Unable to load this news update</h2><p>'+esc(e.message||"An unexpected error occurred.")+'</p><p>Please refresh the page and try again.</p><a class="button" href="index.html">← Homepage</a>'}}start()})();
</script></body></html>
