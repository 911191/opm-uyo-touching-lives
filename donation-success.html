<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Donation Confirmation | OPM UYO TOUCHING LIVES</title><link rel="stylesheet" href="style.css">
<style>.wrap{max-width:680px;margin:70px auto;padding:18px}.card{background:#fff;border:1px solid #e4e8f0;border-radius:18px;padding:30px}.s{padding:14px;border-radius:10px;margin:18px 0}.ok{background:#e6f7ed;color:#126b37}.wait{background:#fff7df;color:#765600}.bad{background:#fee4e2;color:#8a1c16}</style></head>
<body><div class="wrap"><div class="card"><h1>Thank You for Supporting Touching Lives</h1><div id="s" class="s wait">Confirming your payment securely...</div><p id="d"></p><a href="index.html">← Return to OPM UYO TOUCHING LIVES</a></div></div>
<script>(async()=>{const s=document.getElementById("s"),d=document.getElementById("d"),ref=new URLSearchParams(location.search).get("reference");if(!ref){s.className="s bad";s.textContent="No payment reference was supplied.";return}try{const r=await fetch("/api/public/donate-verify?reference="+encodeURIComponent(ref),{cache:"no-store"}),p=await r.json().catch(()=>({}));if(!r.ok)throw Error(p.error||"Verification failed.");s.className=p.status==="success"?"s ok":"s wait";s.textContent=p.status==="success"?"Donation payment confirmed successfully.":"Payment is not yet confirmed. Keep your reference.";d.textContent="Payment reference: "+p.reference}catch(e){s.className="s bad";s.textContent=e.message}})();</script></body></html>
